name: Publish image

# Publishes the container image to GHCR on version tags only. Push a tag like
# v1.2.3 to release:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Runs the required checks and publishes their tested images without rebuilding.
# Produces ghcr.io/<owner>/<repo> with tags 1.2.3, 1.2, and latest (latest only
# moves for non-prerelease tags). Builds linux/amd64 + linux/arm64.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/landing.yml
    permissions:
      contents: read
    with:
      upgrade_scope: full

  publish:
    needs: checks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@v4
        with:
          pattern: upgrade-image-*
          merge-multiple: true
          path: /tmp/upgrade-images

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: ./.github/actions/image-metadata

      - name: Publish the tested images
        working-directory: server
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          UPGRADE_IMAGES: /tmp/upgrade-images
        run: go run ./tools/publish-images
