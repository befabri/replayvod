name: Verify upgrades

on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: latest

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.scope == 'full' && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Docker metadata
        id: meta
        uses: ./.github/actions/image-metadata
      - name: Build candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: replayvod:upgrade-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=upgrade-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=upgrade-${{ matrix.arch }}
          provenance: false
      - name: Upgrade existing installations
        working-directory: server
        env:
          UPGRADE_CANDIDATE_IMAGE: replayvod:upgrade-${{ matrix.arch }}
          UPGRADE_SCOPE: ${{ inputs.scope }}
          UPGRADE_ARTIFACTS: ${{ github.workspace }}/server/target/upgrade
        run: |
          set -o pipefail
          mkdir -p target/upgrade
          go test -tags upgrade -count=1 -timeout 25m -v ./tests/upgrade 2>&1 | tee target/upgrade/test.log
      - name: Save tested image
        if: inputs.scope == 'full'
        env:
          UPGRADE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/upgrade-image
          docker image inspect --format '{{.Id}}' "replayvod:upgrade-$UPGRADE_ARCH" > "/tmp/upgrade-image/$UPGRADE_ARCH.id"
          docker save -o "/tmp/upgrade-image/$UPGRADE_ARCH.tar" "replayvod:upgrade-$UPGRADE_ARCH"
      - name: Retain tested image for publication
        if: inputs.scope == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-image-${{ matrix.arch }}
          path: /tmp/upgrade-image/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Retain upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-diagnostics-${{ matrix.arch }}
          path: server/target/upgrade/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove remaining upgrade resources
        if: always()
        run: |
          docker ps -aq --filter label=replayvod.upgrade=true | xargs -r docker rm -fv
          docker volume ls -q --filter label=replayvod.upgrade=true | xargs -r docker volume rm
          docker network ls -q --filter label=replayvod.upgrade=true | xargs -r docker network rm
